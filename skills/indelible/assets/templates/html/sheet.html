<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="indelible">
<title>$title</title>
<style>
  /* indelible sheet. Printed on A4 (headless browser or File > Print) or read on screen.
     Self-contained: no external fonts, scripts or images. Unicode maths only. */
  :root {
    --ink: #111111;
    --muted: #474747;
    --rule: #1f1f1f;
    --soft: #eeeeee;
    --paper: #ffffff;
    --serif: "Noto Serif", "Libertinus Serif", "Iowan Old Style", "Palatino Linotype", Palatino,
             Georgia, Cambria, serif;
    --mono: "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", "Courier New", monospace;
  }
  @page {
    size: A4;
    margin: 15mm 16mm 18mm 16mm;
    @bottom-center {
      content: "page " counter(page) " of " counter(pages);
      font-family: Georgia, Cambria, serif;
      font-size: 9pt;
      color: #555555;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0 auto;
    max-width: calc(178mm + 32px);
    padding: 24px 16px 48px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 13pt;
    line-height: 1.45;
    overflow-wrap: break-word;
  }
  @media print {
    body { max-width: none; padding: 0; font-size: 12.5pt; }
  }
  h1, h2, h3 { line-height: 1.2; margin: 0; }
  h1 { font-size: 20pt; }
  h2 {
    font-size: 14pt; margin: 7mm 0 3mm; padding-bottom: 1mm;
    border-bottom: 1px solid var(--rule); break-after: avoid;
  }
  .sheet-head .head-row {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2mm 6mm;
  }
  .sheet-head .when { margin: 0; font-size: 12pt; white-space: nowrap; }
  .sheet-head .meta { margin: 1.5mm 0 4mm; font-size: 11pt; color: var(--muted); }

  /* Boxed regions: rules, floor, reading pages */
  .rules, .floor, .pages {
    border: 1.5px solid var(--rule); border-radius: 3px; padding: 2.5mm 5mm 3mm; margin: 0 0 5mm;
    break-inside: avoid;
  }
  .rules h2, .floor h2, .pages h2 { font-size: 12pt; border: 0; margin: 0 0 1mm; padding: 0; }
  .rules ul, .floor ul { margin: 0; padding-left: 5mm; }
  .rules li { font-size: 11.5pt; margin: 0.6mm 0; }
  .rules li.v-rule { font-weight: 700; }
  .pages p { margin: 0; }

  /* Theory */
  .words dl { margin: 0; }
  .words dt { font-weight: 700; margin-top: 2mm; }
  .words .gloss { font-weight: 400; font-style: italic; }
  .words dd { margin: 0 0 0 6mm; }
  .sec p { margin: 0 0 2.5mm; }
  .sec-rule, .sec-warning {
    border: 1.5px solid var(--rule); border-radius: 3px; padding: 0 5mm 1mm; margin: 5mm 0;
    break-inside: avoid;
  }
  .sec-warning { border-style: dashed; }
  .sec-rule h2, .sec-warning h2 { border: 0; margin: 3mm 0 1.5mm; }

  /* Write-in lines: start, stop, least sure */
  .line { display: flex; align-items: flex-end; gap: 2mm; margin: 4mm 0; }
  .line .fill { flex: 1; border-bottom: 1px solid var(--rule); min-height: 8mm; }
  .line .fill.short { flex: 0 0 40mm; }
  .num { font-weight: 700; }

  /* Questions */
  .item { display: grid; grid-template-columns: 10mm minmax(0, 1fr); column-gap: 1mm; margin: 5mm 0 1mm; }
  .item.keep { break-inside: avoid; }
  .qnum { grid-column: 1; font-size: 13pt; }
  .qbody { grid-column: 2; min-width: 0; }
  .stem p { margin: 0 0 2mm; }
  .ask { margin: 1mm 0 5mm; break-inside: avoid; }
  .ask-label { margin: 0 0 1.5mm; }
  .ask-id { font-weight: 700; margin-right: 1.5mm; }
  .box { width: 100%; border: 1.5px solid var(--rule); border-radius: 3px; }
  .check { display: flex; align-items: flex-end; gap: 2mm; margin: 2mm 0 0; }
  .check .fill { flex: 1; border-bottom: 1px solid var(--rule); min-height: 9mm; }
  .hint { margin: 0.8mm 0 0; font-size: 10pt; color: var(--muted); }
  /* Code: verbatim, indentation kept, monospace */
  pre.code {
    font-family: var(--mono); font-size: 10.5pt; line-height: 1.4; white-space: pre; overflow-x: auto;
    margin: 0 0 2.5mm; padding: 2mm 3mm; border: 1px solid #bdbdbd; border-radius: 3px; background: #f6f6f6;
    break-inside: avoid;
  }
  pre.code code { font-family: inherit; font-size: inherit; background: none; padding: 0; }
  code { font-family: var(--mono); font-size: 0.9em; background: #f1f1f1; padding: 0 0.15em; border-radius: 2px; }
  @media print { pre.code { white-space: pre-wrap; overflow-wrap: anywhere; } }
  .gate {
    margin: 3mm 0 5mm; padding: 2.5mm 4mm; border-left: 4px solid var(--rule); background: var(--soft);
    font-weight: 700; break-inside: avoid;
  }

  /* End of sheet */
  .end { margin-top: 8mm; padding-top: 1mm; border-top: 1px solid var(--rule); break-inside: avoid; }
  .close-line { margin: 6mm 0 0; text-align: center; font-size: 13pt; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
$body
</body>
</html>
